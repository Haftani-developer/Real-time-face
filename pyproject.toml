[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "facesentinel"
version = "1.0.0"
description = "Real-time face detection, tracking and recognition with pure OpenCV (YuNet + SFace)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["opencv-python>=4.8.0", "numpy>=1.21"]
keywords = ["opencv", "face-recognition", "face-detection", "computer-vision", "yunet", "sface"]

[project.optional-dependencies]
unicode = ["pillow", "arabic-reshaper", "python-bidi"]
dev = ["pytest"]

[project.scripts]
facesentinel = "facesentinel.cli:main"

[tool.setuptools.packages.find]
include = ["facesentinel*"]
